# Déploiement automatique du site.
#
# Phase de test (lot 0) : construction avec Astro puis publication sur GitHub Pages.
# À la bascule vers Infomaniak, l'étape de publication sera remplacée par un envoi rsync via SSH.
#
# Déclenché à chaque modification de la branche main (y compris celles enregistrées depuis le CMS),
# et manuellement depuis l'onglet « Actions » de GitHub.

name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; le plus récent l'emporte.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire
        run: npm run build

      - name: Préparer l'archive pour Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v5
